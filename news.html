<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новости Factorio</title>
    <meta name="description" content="Последние новости Factorio: обновления, патчи, события, анонсы.">
    <style>
        body {
            background-color: #1a1a1a;
            color: #e0e0e0;
            font-family: 'Courier New', monospace;
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: #2a2a2a;
            padding: 30px;
            border: 2px solid #444;
            border-radius: 8px;
        }
        h1 {
            color: #00cc66;
            text-align: center;
            border-bottom: 1px solid #444;
            padding-bottom: 10px;
        }
        .nav-menu {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin: 30px 0;
            padding: 20px;
            background-color: #1a1a1a;
            border-radius: 50px;
        }
        .nav-menu a {
            color: #00cc66;
            padding: 10px 20px;
            border-radius: 30px;
            background-color: #2a2a2a;
            border: 1px solid #00cc66;
            text-decoration: none;
        }
        .nav-menu a:hover {
            background-color: #00cc66;
            color: #1a1a1a;
        }
        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 30px;
            margin-top: 30px;
        }
        .news-card {
            background-color: #1a1a1a;
            border: 1px solid #444;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.3s;
        }
        .news-card:hover {
            transform: translateY(-5px);
            border-color: #00cc66;
            box-shadow: 0 10px 30px rgba(0, 204, 102, 0.2);
        }
        .news-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-bottom: 2px solid #00cc66;
        }
        .news-content {
            padding: 20px;
        }
        .news-title {
            color: #00cc66;
            font-size: 1.3em;
            margin: 0 0 10px 0;
        }
        .news-date {
            color: #888;
            font-size: 0.85em;
            margin-bottom: 15px;
        }
        .news-date::before {
            content: "📅";
            margin-right: 5px;
        }
        .news-tags {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 15px 0;
        }
        .news-tag {
            background-color: rgba(0, 204, 102, 0.1);
            color: #00cc66;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.8em;
            border: 1px solid #00cc66;
        }
        .read-more {
            color: #00cc66;
            text-decoration: none;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .read-more::after {
            content: "→";
        }
        .footer {
            text-align: center;
            margin-top: 40px;
        }
        .breadcrumbs-modern {
            background: linear-gradient(145deg, #2a2a2a 0%, #1a1a1a 100%);
            padding: 15px 25px;
            margin-bottom: 30px;
            border-radius: 50px;
            border: 1px solid #00cc66;
        }
        .breadcrumbs-modern ul {
            display: flex;
            flex-wrap: wrap;
            list-style: none;
            padding: 0;
            margin: 0;
            align-items: center;
            justify-content: center;
        }
        .breadcrumbs-modern li {
            margin: 5px 10px;
        }
        .breadcrumbs-modern li:not(:last-child)::after {
            content: "›";
            margin-left: 15px;
            color: #00cc66;
            font-size: 1.5em;
        }
        .breadcrumbs-modern a {
            color: #e0e0e0;
            padding: 8px 15px;
            border-radius: 30px;
            background-color: rgba(0, 204, 102, 0.1);
            text-decoration: none;
        }
